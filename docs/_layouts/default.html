<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
{%- include head.html
      title=page.seo_title
      description=page.description
      og_type="article"
      published=page.date %}
  <body>
    <div class="content">
      {% include header.html page=page %}

      {{ content }}

      {% include footer.html archive_link=true subscribe_link=true %}
    </div>
  </body>
</html>
