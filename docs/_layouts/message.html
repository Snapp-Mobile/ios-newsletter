<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
{%- capture message_title %}{{ page.title }} - {{ site.title }}{% endcapture %}
{%- include head.html
      title=message_title
      description=page.description
      og_type="website" %}
  <body>
    <div class="content">
      {% include header.html title=page.title %}
      
      {{ content }}

      {% include footer.html archive_link=true subscribe_link=false %}
    </div>
  </body>
</html>
